# 本番の CI はリポジトリ直下の `.github/workflows/ci.yml` と同期させています。
# 手元で Actions を試す場合はそちらを編集してください。
#
# PAT で `.github/workflows/**` を push するには GitHub のトークンに `workflow` スコープが必要です。
# 無い場合はこのリポジトリの `npm run check` または Vercel のビルドログで代替できます。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
